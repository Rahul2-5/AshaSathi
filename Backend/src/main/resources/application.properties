spring.config.import=optional:file:./config/application-secrets.properties

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.datasource.hikari.maximum-pool-size=10
spring.jpa.open-in-view=false

app.migration.sqlite-to-postgres.enabled=${SQLITE_MIGRATION_ENABLED:false}
app.migration.sqlite-path=${SQLITE_DB_PATH:./data/ashasathi.db}
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:58518}

