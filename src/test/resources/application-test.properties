spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/ashasathi}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.migration.sqlite-to-postgres.enabled=false
app.jwt.secret=test-development-jwt-secret-with-enough-length
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:58518
