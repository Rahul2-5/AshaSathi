spring.config.import=optional:classpath:application-secrets.properties,optional:file:./config/application-secrets.properties
server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/ashasathi}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.hikari.maximum-pool-size=10
spring.jpa.open-in-view=false

app.migration.sqlite-to-postgres.enabled=${SQLITE_MIGRATION_ENABLED:false}
app.migration.sqlite-path=${SQLITE_DB_PATH:./data/ashasathi.db}
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:58518}

# ── Medical Vision Agent ──────────────────────────────────────────────────────
# Gemini 2.5 Flash API key — load from env/Heroku Config Vars only
gemini.api.key=${GEMINI_API_KEY:}

# OCR microservice URL (FastAPI + PaddleOCR)
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8001}

# Upload directory for medical document images
app.upload.dir=${UPLOAD_DIR:uploads}

# Async thread pool for non-blocking AI processing pipeline
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=medical-ai-
